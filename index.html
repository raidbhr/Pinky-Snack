<style>
:root{--pink:#f7c6d3;--pink-soft:#fde4ea;--rose:#c9416f;--rose-d:#a3305a;--cream:#fff6f2;--ink:#2b2326;--mute:#7a6a70;--card:#fff;--wa:#25D366;--line:#f0d3db;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pink:#4a2a35;--pink-soft:#3a222b;--cream:#231a1e;--ink:#f6e9ed;--mute:#c4a9b2;--card:#302329;--line:#4d3540;--rose:#ef7aa1;--rose-d:#e0648f}}
:root[data-theme="dark"]{--pink:#4a2a35;--pink-soft:#3a222b;--cream:#231a1e;--ink:#f6e9ed;--mute:#c4a9b2;--card:#302329;--line:#4d3540;--rose:#ef7aa1;--rose-d:#e0648f}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--pink-soft);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.6}
.app{max-width:480px;margin:0 auto;background:var(--cream);min-height:100vh;box-shadow:0 0 40px rgba(201,65,111,.15);padding-bottom:96px}
header{background:var(--pink);padding:22px 18px 20px;border-radius:0 0 28px 28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.5rem;color:var(--rose-d)}
.brand span{background:var(--rose);color:#fff;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem}
.top{display:flex;align-items:center;justify-content:space-between}.wchat{width:46px;height:46px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 4px 12px rgba(37,211,102,.4)}.wchat svg{width:26px;height:26px;fill:#fff}
.tel{display:inline-block;margin-top:6px;background:var(--card);color:var(--rose-d);font-weight:800;font-size:1.05rem;text-decoration:none;padding:4px 16px;border-radius:999px;letter-spacing:.5px}
header h1{margin:12px 0 2px;font-size:1.25rem;font-weight:800;line-height:1.5}
header p{margin:0;color:var(--mute);font-size:.9rem}
.notice{margin:16px 16px 0;background:var(--card);border:1.5px dashed var(--rose);border-radius:16px;padding:10px 14px;font-weight:600;font-size:.92rem;display:flex;gap:8px}
h2{font-size:1.1rem;margin:22px 16px 10px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.item{background:var(--card);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.pic{height:118px;display:grid;place-items:center;font-size:2.8rem;background:linear-gradient(135deg,var(--pink),var(--pink-soft))}
.pic img{width:100%;height:100%;object-fit:cover}
.body{padding:10px 12px 12px;justify-content:space-between;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:700;font-size:.98rem;line-height:1.35}
.desc{font-size:.76rem;color:var(--mute);flex:1;min-height:2.2em}
.price{align-self:flex-start;background:var(--rose);color:#fff;font-weight:700;font-size:.8rem;padding:1px 10px;border-radius:999px}
.add,.stepper{margin-top:6px;height:40px;border-radius:12px}
.add{border:0;background:var(--rose);color:#fff;font:700 .92rem Cairo,sans-serif;cursor:pointer;transition:transform .12s}
.add:active{transform:scale(.96)}
.stepper{display:none;align-items:center;justify-content:space-between;background:var(--pink-soft);border:1.5px solid var(--rose);padding:0 4px}
.item.in .add{display:none}.item.in .stepper{display:flex}
.stepper button{width:34px;height:32px;border:0;border-radius:9px;background:var(--rose);color:#fff;font-size:1.2rem;font-weight:700;cursor:pointer}
.stepper b{min-width:24px;text-align:center}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--rose-d);outline-offset:2px}
.form{margin:0 16px;background:var(--card);border-radius:20px;border:1px solid var(--line);padding:16px}
.cart-lines{margin:0 0 12px;padding:0;list-style:none}
.cart-lines li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.empty{color:var(--mute);font-size:.9rem;text-align:center;padding:8px 0}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;margin:4px 0 14px;color:var(--rose-d)}
label{display:block;font-weight:600;font-size:.88rem;margin:10px 0 4px}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:var(--cream);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
textarea{resize:vertical;min-height:74px}
.err{color:#c62828;font-size:.82rem;min-height:1.2em;margin:8px 0 0;font-weight:600}
.wa{width:100%;margin-top:8px;height:52px;border:0;border-radius:16px;background:var(--wa);color:#fff;font:800 1.02rem Cairo,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.wa svg{width:24px;height:24px;fill:#fff}
.wa:disabled{opacity:.55;cursor:not-allowed}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--cream);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;z-index:5}
.bar div{flex:1;font-weight:700}.bar small{display:block;color:var(--mute);font-weight:400;font-size:.76rem}
.bar a{background:var(--rose);color:#fff;text-decoration:none;font-weight:700;padding:10px 20px;border-radius:14px}
footer{text-align:center;color:var(--mute);font-size:.82rem;margin:22px 16px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const cart={};
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString("en-US")+" دج";

$("menu").innerHTML=MENU.map(m=>`
<article class="item" id="i${m.id}">
  <div class="pic">${IMG[m.id]?`<img src="${IMG[m.id]}" alt="${m.n}" loading="lazy">`:`<span aria-hidden="true">${m.e}</span>`}</div>
  <div class="body">
    <div class="name">${m.n}</div>
    <span class="price">${m.p} دج</span>
    <button class="add" data-a="${m.id}" data-d="1">إضافة للسلة</button>
    <div class="stepper">
      <button data-a="${m.id}" data-d="1" aria-label="زيادة">+</button>
      <b id="q${m.id}">0</b>
      <button data-a="${m.id}" data-d="-1" aria-label="نقصان">−</button>
    </div>
  </div>
</article>`).join("");

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const id=b.dataset.a;
  cart[id]=Math.max(0,Math.min(50,(cart[id]||0)+ +b.dataset.d));
  if(!cart[id]) delete cart[id];
  render();
});

function totals(){
  let t=0,c=0;
  MENU.forEach(m=>{const q=cart[m.id]||0;t+=q*m.p;c+=q});
  return{t,c};
}
function render(){
  MENU.forEach(m=>{
    const q=cart[m.id]||0;
    $("i"+m.id).classList.toggle("in",q>0);
    $("q"+m.id).textContent=q;
  });
  const {t,c}=totals();
  $("lines").innerHTML=c?MENU.filter(m=>cart[m.id]).map(m=>
    `<li><span>${m.n} × ${cart[m.id]}</span><b>${fmt(cart[m.id]*m.p)}</b></li>`).join("")
    :'<li class="empty">السلة فارغة — أضف منتجات من القائمة</li>';
  $("total").textContent=fmt(t);
  $("barCount").textContent=c+" منتج";
  $("barTotal").textContent=fmt(t);
  $("send").disabled=!c;
}
$("loc").addEventListener("change",()=>{
  const other=$("loc").value==="عنوان آخر في بومرداس";
  $("addr").hidden=$("addrL").hidden=!other;
});

$("send").addEventListener("click",()=>{
  const name=$("name").value.trim(),phone=$("phone").value.replace(/[\s.-]/g,""),
        loc=$("loc").value,addr=$("addr").value.trim(),notes=$("notes").value.trim();
  let msg="";
  if(!name) msg="اكتب الاسم واللقب.";
  else if(!/^(\+?213|0)[5-7]\d{8}$/.test(phone)) msg="رقم الهاتف غير صحيح. مثال: 0542077783";
  else if(!loc) msg="اختر مكان التوصيل.";
  else if(loc.startsWith("عنوان")&&!addr) msg="اكتب العنوان بالتفصيل.";
  $("err").textContent=msg;
  if(msg) return;

  const {t}=totals();
  const lines=MENU.filter(m=>cart[m.id]).map(m=>`• ${m.n} × ${cart[m.id]} = ${cart[m.id]*m.p} دج`).join("\n");
  const text=`🍓 *طلب جديد - Pinky Snack*\n\n${lines}\n\n💰 *المجموع الإجمالي: ${t} دج*\n\n👤 الاسم: ${name}\n📞 الهاتف: ${phone}\n📍 المكان: ${loc}${addr?" - "+addr:""}\n📝 ملاحظات: ${notes||"لا يوجد"}\n\n(طلب ليوم غد - شكرا!)`;
  window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(text)}`,"_blank","noopener");
});
render();
</script>
</body>
</html>
